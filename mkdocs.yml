site_name: Advanced Quantum Mechanics I (PHS 4102)
site_description: Complete lecture notes and worked problems for Advanced Quantum Mechanics I (PHS 4102)
site_url: https://nirban-a.github.io/AQM1-PHS4102-Notes/
repo_url: https://github.com/nirban-a/AQM1-PHS4102-Notes
repo_name: nirban-a/AQM1-PHS4102-Notes
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Source Serif 4
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.action.edit

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
      toc_depth: 3

extra_javascript:
  - javascripts/mathjax.js
  - javascripts/sourcetag.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

exclude_docs: |
  assets/figures/*.pdf

nav:
  - Home: index.md
  - "Part I: Foundations of Quantum Mechanics":
    - Overview: 01-foundations/index.md
    - "1. Postulates of Quantum Mechanics and Dirac Notation": 01-foundations/01-postulates-quantum-mechanics-dirac-notation.md
    - "2. Compatible and Incompatible Operators": 01-foundations/02-compatible-incompatible-operators.md
    - "3. Dirac Delta Function and the Position and Momentum Bases": 01-foundations/03-dirac-delta-function-position-momentum-bases.md
    - "4. Time Evolution: Stationary States and the Schrödinger and Heisenberg Pictures": 01-foundations/04-time-evolution-stationary-states-schrodinger-heisenberg.md
    - "5. The One-Dimensional Time-Independent Schrödinger Equation": 01-foundations/05-one-dimensional-time-independent-schrodinger-equation.md
    - "6. The Linear Harmonic Oscillator: Ladder-Operator Method": 01-foundations/06-linear-harmonic-oscillator-ladder-operator-method.md
    - "7. Classical Limit of the Oscillator: Coherent States": 01-foundations/07-classical-limit-oscillator-coherent-states.md
